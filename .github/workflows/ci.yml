name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - run: npm ci

      - name: Typecheck and immutability gate
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Package contents
        run: npm run check:package
